# This workflow is managed by gh actions-lock.

name: Release

# Publishing uses PyPI trusted publishing, so no API token is stored in GitHub.
# One-time manual setup before pushing the first release tag:
#   1. On PyPI, open https://pypi.org/manage/account/publishing/ (or, once the
#      project exists, the project's Settings > Publishing page) and add a
#      GitHub trusted publisher with:
#        - PyPI project name: django-debug-toolbar-hijack
#        - Owner: the GitHub user or organization that owns this repository
#        - Repository name: django-debug-toolbar-hijack
#        - Workflow name: release.yml
#        - Environment name: pypi
#   2. In GitHub, go to Settings > Environments and create an environment named
#      "pypi". Optionally add required reviewers and restrict it to tags
#      matching "v*".
# Then release in two steps, since main only accepts PRs that pass CI:
#   1. `mise run release:prepare <version|bump>` bumps the version and updates
#      CHANGELOG.md on a release/vX branch and opens a PR to main.
#   2. After the PR is merged, `mise run release:tag --push` tags the merge on
#      main and pushes only the tag, which runs this workflow.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.2.7
        with:
          cache: true
      - name: Check the tag matches the project version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(uv version --short)"
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match the project version $version in pyproject.toml"
            exit 1
          fi
      - run: uv build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/django-debug-toolbar-hijack/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist/
      - uses: jdx/mise-action@v5.2.7
        with:
          cache: true
          install_args: uv
      - run: uv publish --trusted-publishing always
