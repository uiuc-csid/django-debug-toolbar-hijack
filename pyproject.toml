[project]
name = "django-debug-toolbar-hijack"
version = "0.1.0"
description = "A django-debug-toolbar panel for impersonating users via django-hijack"
readme = "README.md"
authors = [
    { name = "Josh Asplund", email = "joshasplund@gmail.com" }
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["django", "debug-toolbar", "django-debug-toolbar", "hijack", "django-hijack", "impersonation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "django>=5.2",
    "django-debug-toolbar>=5.1.0",
    "django-hijack>=3.7",
]

[project.urls]
Homepage = "https://github.com/uiuc-csid/django-debug-toolbar-hijack"
Source = "https://github.com/uiuc-csid/django-debug-toolbar-hijack"
Issues = "https://github.com/uiuc-csid/django-debug-toolbar-hijack/issues"
Changelog = "https://github.com/uiuc-csid/django-debug-toolbar-hijack/blob/main/CHANGELOG.md"

[dependency-groups]
# Floors keep `uv run --resolution lowest-direct` (mise run test:lowest) from
# resolving ancient tool versions; only the runtime floors are under test there.
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pytest-cov>=6.0",
    "ruff>=0.17",
    "mypy>=1.15",
    "django-stubs[compatible-mypy]>=5.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "debug_toolbar_hijack"

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "DJ", "RUF", "PT"]

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = ["hijack.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]

[tool.coverage.run]
source = ["debug_toolbar_hijack"]
